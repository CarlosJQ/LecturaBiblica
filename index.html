<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lectura Bíblica">
    <meta name="theme-color" content="#1a1a2e">
    <title>Mi Lectura Bíblica Diaria</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <h1>📖 Mi Lectura Bíblica</h1>
            <p class="subtitle" id="current-date"></p>
        </header>

        <!-- Pestañas -->
        <nav class="tabs" aria-label="Secciones">
            <button id="tab-biblia" class="tab active" type="button" aria-pressed="true">📖 Biblia</button>
            <button id="tab-libros" class="tab" type="button" aria-pressed="false">📚 Libros</button>
        </nav>

        <div id="vista-biblia">
        <!-- Navegación de fecha -->
        <nav class="date-nav">
            <button id="btn-prev" class="nav-btn" aria-label="Día anterior">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <button id="btn-today" class="nav-btn today-btn">Hoy</button>
            <button id="btn-next" class="nav-btn" aria-label="Día siguiente">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </button>
        </nav>

        <!-- Calendario horizontal -->
        <section class="calendar-section">
            <div id="calendar-container" class="calendar-container">
            </div>
        </section>

        <!-- Lecturas del día -->
        <main class="readings-container">
        </main>

        <!-- Leyenda -->
        <footer class="app-footer">
            <div class="legend" id="legend"></div>
        </footer>

        <button id="btn-config" class="config-open-btn" type="button">⚙️ Configurar plan de lectura</button>
        </div>

        <!-- Lectura de libros -->
        <div id="vista-libros" hidden></div>

        <!-- Respaldo de las lecturas marcadas -->
        <details class="backup-section" id="backup-section">
            <summary>💾 Respaldo de mis lecturas</summary>
            <p class="backup-info" id="backup-info"></p>

            <div class="backup-actions">
                <button id="btn-export-file" class="backup-btn" type="button">Guardar archivo</button>
                <button id="btn-export-copy" class="backup-btn" type="button">Copiar como texto</button>
                <label for="import-file" class="backup-btn">Importar archivo</label>
                <input type="file" id="import-file" accept=".json,application/json,text/plain" hidden>
            </div>

            <label class="backup-label" for="backup-text">O pega aquí el texto de un respaldo:</label>
            <textarea id="backup-text" class="backup-text" rows="4" spellcheck="false"
                autocapitalize="off" autocomplete="off"></textarea>
            <button id="btn-import-text" class="backup-btn" type="button">Restaurar texto pegado</button>

            <p class="backup-status" id="backup-status" role="status" aria-live="polite"></p>
        </details>
    </div>

    <!-- Configurador del plan de lectura -->
    <section class="config-panel" id="config-panel" hidden aria-label="Configurar plan de lectura">
        <div class="config-inner">
            <header class="config-header">
                <h2>⚙️ Plan de lectura</h2>
                <button id="btn-config-close" class="nav-btn" type="button">Cerrar</button>
            </header>
            <div id="config-body"></div>
        </div>
    </section>

    <!-- Ficha de un libro: marcar lectura, historial y edición -->
    <section class="config-panel" id="libro-panel" hidden aria-label="Libro">
        <div class="config-inner">
            <header class="config-header">
                <h2 id="libro-panel-titulo">📚 Libro</h2>
                <button id="btn-libro-close" class="nav-btn" type="button">Cerrar</button>
            </header>
            <div id="libro-body"></div>
        </div>
    </section>

    <!-- Visor de fotos a pantalla completa -->
    <section class="foto-visor" id="foto-visor" hidden aria-label="Foto de la página">
        <header class="visor-barra">
            <span id="visor-pos"></span>
            <div class="visor-botones">
                <button id="visor-zoom" class="nav-btn" type="button">Ampliar</button>
                <button id="visor-borrar" class="nav-btn" type="button">Borrar</button>
                <button id="visor-cerrar" class="nav-btn today-btn" type="button">Cerrar</button>
            </div>
        </header>
        <div class="visor-lienzo" id="visor-lienzo"><img id="visor-img" alt="Página fotografiada"></div>
        <footer class="visor-barra">
            <button id="visor-ant" class="nav-btn" type="button">‹ Anterior</button>
            <button id="visor-sig" class="nav-btn" type="button">Siguiente ›</button>
        </footer>
    </section>

    <script src="app.js"></script>
    <script src="libros.js"></script>
    <script src="fotos.js"></script>
    <script src="config.js"></script>
</body>

</html>
